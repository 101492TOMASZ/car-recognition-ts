<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" source="style.css" href="style.css">
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const fileInput = document.getElementById("fileInput");
            fileInput.addEventListener("change", function(event) {
                const file = event.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        const img = new Image();
                        img.src = e.target.result;
                        img.onload = function() {
                            console.log("Image loaded successfully!");
                            // You can now use the image as needed
                        };
                    };
                    reader.readAsDataURL(file);
                }
            });
            const uploadButton = document.getElementById("uploadButton");
            uploadButton.addEventListener("click", function() {
                const fileInput = document.getElementById("fileInput");
                if (fileInput.files.length > 0) {
                    const file = fileInput.files[0];
                    const formData = new FormData();
                    formData.append("file", file);

                    fetch("http://192.168.55.107:8000/predict", { // Corrected URL to send POST to the correct endpoint
                        method: "POST",
                        body: formData
                    })
                    .then(response => response.json())
                    .then(data => {
                        console.log("File uploaded successfully:", data);
                        // Display the returned values on the frontend
                        const resultDiv = document.getElementById("result");
                        resultDiv.innerHTML = `<p>Brand: ${data.brand}</p><p>Confidence: ${data.confidence}</p>`;
                    })
                    .catch(error => {
                        console.error("Error uploading file:", error);
                    });
                } else {
                    alert("Please select a file to upload.");
                }
            });
        });
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <main>
        <header>
            <h1>Jakie to auto?</h1>
        </header>
        <section>
            <input type="file" id="fileInput" accept=".jpg" />
            <input type="button" id="uploadButton" value="Upload" />
            <div id="result"></div>
        </section>
    </main>

</body>
</html>
