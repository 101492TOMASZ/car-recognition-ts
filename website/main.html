<!DOCTYPE html>
<html lang="pl">
<head>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="logos/favicon.ico">
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const fileInput = document.getElementById("fileInput");
            const previewImg = document.getElementById("preview");
            fileInput.addEventListener("change", function(event) {
                const file = event.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        previewImg.src = e.target.result;
                        previewImg.style.display = "block";
                    };
                    reader.readAsDataURL(file);
                } else {
                    previewImg.src = "";
                    previewImg.style.display = "none";
                }
            });
            const uploadButton = document.getElementById("uploadButton");
            uploadButton.addEventListener("click", function() {
                const fileInput = document.getElementById("fileInput");
                if (fileInput.files.length > 0) {
                    const file = fileInput.files[0];
                    const formData = new FormData();
                    formData.append("file", file);

                    fetch("http://localhost:8000/predict", { // Corrected URL to send POST to the correct endpoint
                        method: "POST",
                        body: formData
                    })
                    .then(response => response.json())
                    .then(data => {
                        console.log("File uploaded successfully:", data);
                        // Display the returned values on the frontend
                        const resultDiv = document.getElementById("result");
                        
                        // Mapowanie brand -> logo
                        const logoMap = {
                            'AUDI': 'logos/AUDI.svg',
                            'BMW': 'logos/BMW.svg',
                            'FORD': 'logos/FORD.svg',
                            'HYUNDAI': 'logos/HYUNDAI.svg',
                            'KIA': 'logos/KIA.svg',
                            'OPEL': 'logos/OPEL.svg',
                            'RENAULT': 'logos/RENAULTL.svg',
                            'SKODA': 'logos/SKODA.svg',
                            'TOYOTA': 'logos/TOYOTA.svg',
                            'VOLKSWAGEN': 'logos/VW.svg',
                        };                        const brandKey = (data.brand || '').toUpperCase(); // Konwertuj na wielkie litery
                        const logoPath = logoMap[brandKey];
                        let logoHtml = '';
                        console.log('Brand:', brandKey, 'Logo path:', logoPath); // Debugowanie
                        if (logoPath) {
                            logoHtml = `<img src="${logoPath}" alt="${data.brand} logo" class="brand-logo" style="height:240px; margin-bottom:10px; display:block; margin-left:auto; margin-right:auto;" />`;
                        } else {
                            console.log('Logo not found for brand:', brandKey); // Debugowanie
                        }
                        // Wyświetl logo, nazwę marki i pewność
                        const confidence = Math.round(data.confidence * 100) / 100;
                        resultDiv.innerHTML = `${logoHtml}<div style='text-align:center;'><strong>${data.brand || ''}</strong></div><p>Pewność: ${confidence}%</p>`;
                    })
                    .catch(error => {
                        console.error("Error uploading file:", error);
                    });
                } else {
                    alert("Please select a file to upload.");
                }
            });
        });

        // Przełącznik trybu ciemnego
        document.addEventListener('DOMContentLoaded', function () {
            const themeSwitcher = document.getElementById('themeswitcher');

            // Domyślnie ustaw tryb jasny (white mode)
            document.body.classList.remove('darkmode');

            themeSwitcher.addEventListener('click', () => {
                document.body.classList.toggle('darkmode');
            });
        });

        document.addEventListener('DOMContentLoaded', function () {
            // Sprawdzanie statusu API
            const statusSpan = document.createElement('span');
            statusSpan.style.fontSize = '12px';
            statusSpan.style.display = 'block';
            statusSpan.style.marginTop = '5px';
            document.querySelector('footer h3').appendChild(statusSpan);

            function checkApiStatus() {
                fetch("http://localhost:8000/status")
                    .then(response => response.json())
                    .then(data => {
                        const isOnline = data.status === "online";
                        statusSpan.textContent = isOnline ? "online" : "offline";
                        statusSpan.style.color = isOnline ? "#4CAF50" : "#f44336";
                    })
                    .catch(() => {
                        statusSpan.textContent = "offline";
                        statusSpan.style.color = "#f44336";
                    });
            }

            // Sprawdź status od razu
            checkApiStatus();

            // Sprawdzaj status co sekundę
            setInterval(checkApiStatus, 3000);
        });
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jakie to auto?</title>
</head>
<body>
    <main>
        <header>
            <h1>Jakie to auto?</h1>
            <h3>Rozpoznawanie marki samochodu na podstawie zdjęcia</h3>
            <h6>Wybierz zdjęcie samochodu, a my spróbujemy zgadnąć jego markę!</h6>
        </header>
        
        <section>
            <div id="result"></div>
            <img id="preview" style="max-width:300px; display:none; margin:20px auto;" />
            <input type="file" id="fileInput" accept=".jpg" hidden />
            <label class="uploadStyl" for="fileInput">Wybierz zdjęcie samochodu</label>
            <input type="button" id="uploadButton" value="Upload" />
        </section>
        
        <footer>
            <h3>Tomasz Słociński 2025</h3>
            <button id="themeswitcher" class="theme-switcher" title="Przełącz tryb ciemny/jasny">
                <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="http://www.w3.org/2000/svg" width="24px">
                    <path d="M480-120q-150 0-255-105T120-480q0-150 105-255t255-105q14 0 27.5 1t26.5 3q-41 29-65.5 75.5T444-660q0 90 63 153t153 63q55 0 101-24.5t75-65.5q2 13 3 26.5t1 27.5q0 150-105 255T480-120Z"/>
                </svg>
                
            </button>
        </footer>
    </main>
</body>
</html>
